    .modal{display:none;position:absolute;z-index:60;inset:0;align-items:flex-end;justify-content:center;padding:18px;background:#000a;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}.modal.show{display:flex}.sheet{width:100%;max-width:460px;padding:22px;border:1px solid #373c46;border-radius:24px;background:#14161b;box-shadow:0 30px 80px #000c;animation:sheetIn .28s ease}.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.sheet h2{margin:0;font-size:22px;font-weight:720}.close{width:36px;height:36px;border:1px solid #3a3f49;border-radius:11px;background:#1d2026;font-size:21px;cursor:pointer}.langs{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.lang{height:38px;padding:0 3px;border:1px solid #303540;border-radius:10px;background:#191c22;color:var(--soft);font-size:11px;font-weight:750;cursor:pointer;white-space:nowrap}.lang.active{border-color:#f7f8fa;background:#f7f8fa;color:#090a0d}.settings-sheet{max-width:430px}.settings-group{margin-top:18px}.settings-label{display:block;margin:0 0 9px;color:#8f96a3;font-size:10px;font-weight:800;letter-spacing:.1em;text-align:left}.sound-options{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.sound-option,.countdown-option{height:42px;padding:0 4px;border:1px solid #303540;border-radius:11px;background:#191c22;color:var(--soft);font-size:10px;font-weight:800;letter-spacing:.04em;cursor:pointer;transition:.14s}.sound-option.active,.countdown-option.active{border-color:#f7f8fa;background:#f7f8fa;color:#090a0d}.sound-option:active,.countdown-option:active{transform:scale(.95)}.countdown-options{display:grid;grid-template-columns:1fr 1fr;gap:7px}.steps{display:grid;gap:11px;margin:0;padding:0;list-style:none;text-align:left}.steps li{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;color:#cdd2dc;font-size:14px;line-height:1.55}.steps b{display:grid;place-items:center;width:25px;height:25px;border:1px solid #424854;border-radius:8px;c <body>
  <div id="app"><main class="machine">
    <header class="topbar"><button class="back-btn" id="backBtn" aria-label="Back to home">←</button><div class="brand">1 TO 10</div><div class="top-actions"><button class="records-btn show" id="recordsBtn" aria-label="Records">✓</button><button class="settings-btn" id="settingsBtn" aria-label="Settings">⚙</button></div></header>
    <section class="screen start active" id="startScreen">
      <span class="home-ghost one" aria-hidden="true">1</span><span class="home-ghost ten" aria-hidden="true">10</span>
      <h1 class="home-title">1 TO 10</h1>
      <div class="home-controls"><div class="level-card"><div class="level-control"><button class="level-btn" id="minusBtn" aria-label="Decrease">−</button><div class="level-value">1 → <b id="levelValue">10</b></div><button class="level-btn" id="plusBtn" aria-label="Increase">＋</button></div><div class="level-slider"><input class="level-range" id="levelRange" type="range" min="0" max="20" step="0.01" value="10" aria-label="Level"></div></div>

      <button class="rank-btn" id="rankBtn" aria-label="Rank thresholds">RANK</button><button class="help-btn" id="helpBtn" aria-label="How to play">?</button>

  <script>
    (()=>{"use strict";
      const $=id=>document.getElementById(id),screens=[$("startScreen"),$("gameScreen"),$("resultScreen")];
